name: terraform

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read
    id-token: write
    pull-requests: write

concurrency:
    group: terraform=${{ github.ref }}
    cancel-in-progress: false

env:
    TF_IN_AUTOMATION: "true"
    TF_VERSION: "1.9.8"
    CONFTEST_VERSION: "0.56.0"

    # Non-secret inputs on Github
    TF_VAR_org_id: ${{ vars.ORG_ID }}
    TF_VAR_billing_account: ${{ vars.BILLING }}
    TF_VAR_prefix: ${{ vars.PREFIX }}
    TF_VAR_seed_project: ${{ vars.SEED_PROJECT }}
    TF_VAR_domain: ${{ vars.DOMAIN }}
    TF_VAR_customer_id: ${{ vars.CUSTOMER_ID }}
    TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
    checks:
        name: Static checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/terraform@v3
              with:
                terraform_version: ${{ env.TF_VERSION }}
            - name: Format
              run: terraform init -backend=false -input=false && terraform validate
            - uses: terraform-linters/setup-tflint@v4
            - name: Lint
              run: tflint --init && tflint --recursive
            - name: Security scan
              uses: aquasecurity/trivy-action@0.35.0
              with:
                scan-type: config
                scan-ref: .
                severity: MEDIUM, HIGH, CRITICAL
                exit-code: "1"

    plan:
        